<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NetWatch · 网络监测平台</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body>
<aside class="sidebar"><a class="brand" href="/" aria-label="NetWatch 首页"><span class="brand-icon">N</span><span>NetWatch<small>网络监测平台</small></span></a><div class="nav-label">工作空间</div><nav aria-label="主导航"><button data-view="overview" class="nav active"><span>◫</span>监控总览</button><button data-view="topology" class="nav"><span>⌘</span>网络拓扑</button><button data-view="devices" class="nav"><span>▤</span>设备管理</button><button data-view="alerts" class="nav"><span>♧</span>告警中心<b id="alertBadge">0</b></button><button data-view="guide" class="nav"><span>⚙</span>接入与说明</button></nav><div class="sidebar-bottom"><span class="live-dot"></span>本机采集服务<small>SNMP v2c · ICMP<br>Windows 便携版 / v1.0</small></div></aside>
<div class="workspace"><header><div class="breadcrumb">工作空间 <span>/</span> <b id="breadcrumb">监控总览</b></div><div class="header-right"><span id="connection" class="connection">连接中</span><span id="clock"></span></div></header>
<main><div class="page-heading"><div><div class="eyebrow">NETWORK OBSERVABILITY</div><h1 id="pageTitle">网络运行，一目了然。</h1><p id="pageSubtitle">掌握设备状态、端口流量与网络变化。</p></div><div class="heading-actions"><button class="button" id="pollButton" data-action="poll">↻ 立即采集</button><button class="button primary" data-action="add">＋ 添加设备</button></div></div>
<div id="notice" class="notice hidden" role="status"></div><section id="stats" class="stats" aria-label="监控指标"></section>
<div class="filterbar" id="filterbar"><div class="segmented"><button data-filter="all" class="selected">全部设备</button><button data-filter="online">在线</button><button data-filter="problem">异常</button></div><div class="filters"><input id="search" type="search" placeholder="搜索设备、IP 或位置" aria-label="搜索设备"><select id="typeFilter" aria-label="设备类型"><option value="">全部类型</option><option>交换机</option><option>路由器</option><option>防火墙</option><option>其他</option></select></div></div>
<div id="content"></div><footer>本地采集 · 本地存储 <span id="updated">等待数据</span></footer></main></div>
<dialog id="deviceDialog"><form id="deviceForm"><div class="dialog-header"><div><small>DEVICE CONNECTION</small><h2 id="dialogTitle">添加网络设备</h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button></div><div class="form-grid"><input type="hidden" name="Id"><label>设备名称<input required name="Name" maxlength="80" placeholder="例如：核心交换机"></label><label>管理 IP<input required name="Address" placeholder="192.168.1.1 或 IPv6 地址"></label><label>设备类型<select name="Type"><option>交换机</option><option>路由器</option><option>防火墙</option><option>其他</option></select></label><label>位置 / 分组<input name="Location" maxlength="100" placeholder="例如：总部 · 三楼机房"></label><label class="wide">SNMP v2c 只读社区字符串<input name="Community" type="password" autocomplete="new-password" maxlength="128" placeholder="填写设备配置的只读 community"><small id="communityHelp">在设备侧开启 SNMP v2c，并允许本机管理 IP 读取。</small></label><label>SNMP UDP 端口<input required type="number" name="Port" value="161" min="1" max="65535"></label><label>轮询间隔（秒）<input required type="number" name="Interval" value="60" min="30" max="3600"></label><label>请求超时（毫秒）<input required type="number" name="Timeout" value="1500" min="300" max="5000"></label><label>利用率告警阈值（%）<input required type="number" name="Threshold" value="85" min="1" max="100"></label><details class="wide"><summary>可选：CPU 与内存 OID</summary><p class="muted">填写厂商提供的百分比标量 OID（返回 0–100，通常以 .0 结尾）。不填写则显示“未配置”。</p><label>CPU 使用率 OID<input name="CpuOid" placeholder="1.3.6.1.4.1.… .0"></label><label>内存使用率 OID<input name="MemoryOid" placeholder="1.3.6.1.4.1.… .0"></label></details><label class="checkbox wide"><input name="Enabled" type="checkbox" checked>启用定时监测</label></div><p id="formError" class="form-error" role="alert"></p><div class="dialog-footer"><button type="button" class="button" data-action="close-dialog">取消</button><button type="submit" class="button primary" id="saveButton">保存并开始监测</button></div></form></dialog>
<div id="toast" role="status" class="toast hidden"></div>
</body></html>
